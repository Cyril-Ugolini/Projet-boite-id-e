<div class="p-4 mx-auto" style="max-width: 1200px">

  <!-- Header -->
<div class="flex justify-content-between align-items-center mb-5">
  <h1 class="m-0 text-primary">💡 Boîte à idées</h1>
  <div class="flex gap-2 align-items-center">
    <span class="text-color-secondary text-sm">
      <i class="pi pi-user"></i> {{ authService.getLogin() }}
      <span class="badge badge-info ml-2">{{ authService.getRole() }}</span>
    </span>
    <p-button label="Nouvelle idée" icon="pi pi-plus" (onClick)="ouvrirDialog()" />
    <p-button icon="pi pi-sign-out" severity="secondary" [rounded]="true" (onClick)="seDeconnecter()" pTooltip="Se déconnecter" />
  </div>
</div>

  <!-- Grille des idées -->
  <div class="grid" *ngIf="idees.length > 0">
    <div class="col-12 md:col-6 lg:col-4" *ngFor="let idee of idees">
      <p-card [header]="idee.titre" styleClass="idee-card" (click)="ouvrirDetail(idee.idIdee)">

        <!-- Tags -->
        <div class="flex gap-2 mb-3 flex-wrap">
          <p-tag [value]="'Priorité : ' + idee.priorite" [severity]="getSeverity(idee.priorite)" />
          <p-tag [value]="'Difficulté : ' + idee.difficulte" [severity]="getSeverity(idee.difficulte)" />
        </div>

        <!-- Métadonnées -->
        <div class="flex gap-3 text-color-secondary text-sm mb-2">
          <span class="flex align-items-center gap-1">
            <i class="pi pi-user"></i>{{ idee.auteur }}
          </span>
          <span class="flex align-items-center gap-1">
            <i class="pi pi-comments"></i>{{ idee.nbCommentaires }}
          </span>
          <span class="flex align-items-center gap-1">
            <i class="pi pi-thumbs-up"></i>{{ idee.nbVotes }}
          </span>
        </div>

        <!-- Date -->
        <div class="text-color-secondary text-xs">
          <i class="pi pi-calendar"></i>{{ idee.dateCreation | date:'dd/MM/yyyy HH:mm' }}
        </div>

      </p-card>
    </div>
  </div>

  <!-- Message liste vide -->
  <div class="flex flex-column align-items-center justify-content-center p-6 text-color-secondary"
       *ngIf="idees.length === 0">
    <i class="pi pi-lightbulb text-5xl mb-3"></i>
    <p class="text-lg">Aucune idée pour le moment. Soyez le premier !</p>
  </div>

</div>

<!-- Dialog création -->
<p-dialog header="💡 Nouvelle idée" [(visible)]="showDialog" [modal]="true" [style]="{width: '520px'}">

  <div class="flex flex-column gap-3 pt-2">

    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Titre *</label>
      <input pInputText [(ngModel)]="newIdee.titre" placeholder="Titre de l'idée" />
    </div>

    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Auteur *</label>
      <input pInputText [(ngModel)]="newIdee.auteur" placeholder="Votre prénom" />
    </div>

    <div class="flex gap-3">
      <div class="flex flex-column gap-1 flex-1">
        <label class="font-semibold text-sm">Priorité</label>
        <p-select [options]="niveaux" [(ngModel)]="newIdee.priorite" optionLabel="label" optionValue="value" />
      </div>
      <div class="flex flex-column gap-1 flex-1">
        <label class="font-semibold text-sm">Difficulté</label>
        <p-select [options]="niveaux" [(ngModel)]="newIdee.difficulte" optionLabel="label" optionValue="value" />
      </div>
    </div>

    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Contenu</label>
      <textarea pTextarea [(ngModel)]="newIdee.contenu" rows="4" placeholder="Décrivez votre idée..."></textarea>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <p-button label="Annuler" severity="secondary" (onClick)="showDialog = false" />
    <p-button label="Créer" icon="pi pi-check" (onClick)="creerIdee()" />
  </ng-template>

</p-dialog>
